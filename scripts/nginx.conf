server {
  listen 80;
  server_name druggie.org dev.druggie.org;
  location /.well-known/acme-challenge/ { root /var/www/newdrugs-acme; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  server_name druggie.org;
  ssl_certificate /etc/letsencrypt/live/druggie.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/druggie.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 16m;
  location / {
    proxy_pass http://127.0.0.1:7331;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }
}
server {
  listen 443 ssl;
  server_name dev.druggie.org;
  ssl_certificate /etc/letsencrypt/live/druggie.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/druggie.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 16m;
  location / {
    proxy_pass http://127.0.0.1:7333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }
}
