# Production-only personal-site host. Install after wildcard DNS and the
# druggie-sites DNS-01 certificate exist. Exact app/dev hosts keep precedence.
limit_req_zone $binary_remote_addr zone=newdrugs_sites:10m rate=20r/s;
server {
  listen 80;
  server_name *.druggie.org;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name *.druggie.org;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
  ssl_certificate /etc/letsencrypt/live/druggie-sites/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/druggie-sites/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 1m;

  location / {
    limit_req zone=newdrugs_sites burst=40 nodelay;
    proxy_pass http://127.0.0.1:7331;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-NewDrugs-Dev-Key "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 30s;
  }
}
